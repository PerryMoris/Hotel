{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mx-auto-max py-4">
    <div class="ui-row mb-4">
        <div class="ui-col">
            <div class="ui-card">
                <h3 class="mb-2">Rooms</h3>
                <p class="text-muted">Total Rooms: <strong id="number_of_rooms"></strong></p>
                <p class="text-muted">Available Rooms: <strong id="available_rooms"></strong></p>
                <p class="text-muted">Occupied Rooms: <strong id="occupiedBeds"></strong></p>
            </div>
        </div>
        <div class="ui-col">
            <div class="ui-card">
                <h3 class="mb-2">Clients On Board</h3>
                <p class="text-muted"><strong id="number_of_clients"></strong></p>
            </div>
        </div>
        <div class="ui-col">
            <div class="ui-card">
                <h3 class="mb-2">Quick Actions</h3>
                <div class="d-flex gap-2 flex-wrap">
                    <a class="btn btn-primary" href="{% url 'room-list' %}">Rooms</a>
                    <a class="btn btn-secondary" href="{% url 'client-detail' %}">Clients</a>
                </div>
            </div>
        </div>
    </div>

    <div class="ui-card mt-3">
        <h4 class="mb-3">Finance Filters</h4>
        <form class="row g-3 align-items-end">
            <div class="col-sm-6 col-md-3">
                <label class="form-label">Year</label>
                <select class="form-select">
                    <option>2024</option>
                    <option>2023</option>
                    <option>2022</option>
                    <option>2021</option>
                </select>
            </div>
            <div class="col-sm-6 col-md-3">
                <label class="form-label">Month</label>
                <select class="form-select">
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                </select>
            </div>
            <div class="col-sm-6 col-md-3">
                <label class="form-label">Week</label>
                <select class="form-select">
                    <option>Week 1</option>
                    <option>Week 2</option>
                </select>
            </div>
            <div class="col-sm-6 col-md-3 text-end">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>
    </div>

    <div class="mt-4">
        <!-- placeholder for charts or lists -->
        <div class="ui-card"> <canvas id="dashboardChart" height="120"></canvas> </div>
    </div>

    <div class="mt-5">
        <footer class="text-muted small">&copy; {{ now.year }} {{ hotelname }}</footer>
    </div>

</div>
{% endblock %}
