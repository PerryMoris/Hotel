{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 75vh;">
    <div class="ui-card" style="max-width:420px;width:100%">
        {% for message in messages %}
        <script>Swal.fire({ icon: '{% if message.tags %}{{ message.tags }}{% else %}info{% endif %}', title: '{% if message.tags == "error" %}Error{% else %}Notice{% endif %}', text: '{{ message }}' })</script>
        {% endfor %}

        <h4 class="mb-3 text-center">Staff Log In</h4>
        <form method="post">
            {% csrf_token %}
            <div class="mb-2">
                <input name="username" type="text" class="form-control" placeholder="Staff Username" required>
            </div>
            <div class="mb-3">
                <input name="password" type="password" class="form-control" placeholder="Staff Password" required>
            </div>
            <div class="text-center">
                <button class="btn btn-primary w-50" type="submit">Log In</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
