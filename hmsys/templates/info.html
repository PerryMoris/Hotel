{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}
{% block content %}
<div class="container py-4">
    <div class="ui-card mx-auto" style="max-width:720px;">
        <h2 class="mb-3">Register the Hotel or Guesthouse</h2>
        <form method="post" enctype="multipart/form-data" class="mt-3">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-3"><button type="submit" class="btn btn-success">Save Info</button></div>
        </form>
    </div>
</div>
{% endblock %}
