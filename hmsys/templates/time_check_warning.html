{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="ui-card">
    <h3 class="mb-3">Time Check Warnings</h3>
    <ul class="list-group">
      {% for warn in warnings %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <strong>{{ warn.title }}</strong>
          <div class="small text-muted">{{ warn.detail }}</div>
        </div>
        <div class="text-muted small">{{ warn.created_on }}</div>
      </li>
      {% empty %}
      <li class="list-group-item">No warnings</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
