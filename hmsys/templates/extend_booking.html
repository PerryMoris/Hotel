{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="ui-card">
    <h3 class="mb-3">Extend Booking</h3>
    <form method="post" action="{% url 'extend_booking' booking.id %}">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">New Check-out</label>
          <input type="date" name="checkout" class="form-control" value="{{ booking.Check_out }}">
        </div>
        <div class="col-md-6 d-flex align-items-end">
          <button class="btn btn-primary">Extend</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% extends 'base.html' %}
{% block content %}
<div class="tainer">
    
    <div style=" display: flex; flex-direction: column; align-items: center;">
    <h1>Extend Booking for {{ booking.client.get_full_name }}</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="days_to_add" class="form-label">Number of Days to Add</label>
            <input type="number" style="width: 600px;" name="days_to_add" id="days_to_add" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Extend Booking</button>
    </form>
    </div>
    
</div>
{% endblock %}
